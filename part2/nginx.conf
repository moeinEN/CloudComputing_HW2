log_format queue '$request $status upstream=$upstream_addr';

upstream queue_backend {
    zone queue_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server app:8000 resolve;
}

server {
    listen 80;
    access_log /var/log/nginx/access.log queue;

    location / {
        proxy_pass http://queue_backend;
        proxy_next_upstream off;
    }
}
