services:
  app:
    build: .
    environment:
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - queue-data:/data
  proxy:
    image: nginx:1.28-alpine
    depends_on:
      - app
    ports:
      - "${APP_PORT:?Set APP_PORT in part2/.env}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  queue-data:
